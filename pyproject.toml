[project]
name = "blogagentic"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "sartaj-sb", email = "sartajsudheerbabu@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "colorama>=0.4.6",
    "fastapi>=0.141.1",
    "langchain>=1.4.0",
    "langchain-community>=0.4.2",
    "langchain-core>=1.6.2",
    "langchain-groq>=1.1.3",
    "langgraph>=1.2.11",
    "langgraph-cli[inmem]>=0.4.31",
    "uvicorn>=0.52.4",
    "watchdog>=6.0.0",
]

[project.scripts]
blogagentic = "blogagentic:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"
